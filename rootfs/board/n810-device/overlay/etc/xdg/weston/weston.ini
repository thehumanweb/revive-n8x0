# Weston on the N810 panel (the display driver runs it at 40 Hz by default: one refresh every 25 ms).
[core]
# Weston starts a repaint this long before it expects the next refresh. It expects one every 19.6 ms (the 51 Hz mode), the
# panel's tearing-effect pulse comes every 25 ms (the controller runs the panel at about 40 Hz), and a repaint takes 10-12 ms
# here (a client's frame, Weston's draws, the commit), so the default of 7 ms misses the pulse half the time and a frame then
# waits a whole extra period: a 250 x 250 client measured 26.6 fps with 7 ms and 40 fps (the panel's limit) with 12 to 20.
repaint-window=16
